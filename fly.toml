# One machine, one volume, one job: hold the operation log.
#
# `min_machines_running = 0` lets it sleep when nobody is syncing, which is
# what keeps it inside the free allowance. Waking costs a second or two, and
# the app tolerates that because it is offline-first by design - a sync that
# has to wait is not a user-visible failure.

app = "tally-sync"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/tally.sqlite"

# The ledger lives here. A volume binds the app to one machine, which is the
# right trade for this: SQLite on a shared filesystem would be a worse
# problem than not scaling horizontally.
[[mounts]]
  source = "tally_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
